version: "2"

# Один модуль = одна запись: SQL в db/queries/<module>, код в internal/<module>/store.
# Блок overrides (время и деньги без pgtype-обёрток) повторяется в каждом пакете намеренно:
# глобальные overrides и YAML-якоря sqlc не применяет. Имена типов даны в двух написаниях
# («timestamptz» и «pg_catalog.timestamptz»): sqlc в разных случаях сопоставляет то одно, то другое.
# Новый модуль — скопировать запись целиком. Строки после «-- +goose Down» в миграциях sqlc игнорирует.
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/auth
    gen:
      go:
        package: store
        out: internal/auth/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "pg_catalog.date"
            go_type: "time.Time"
          - db_type: "pg_catalog.date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"

