# Postgres для локальной разработки: база cargo для приложения и cargo_test для тестов.
services:
  db:
    image: postgres:17-alpine
    container_name: cargo-dev-db
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
      POSTGRES_DB: cargo
    ports:
      - "5432:5432"
    volumes:
      - cargo-dev-db:/var/lib/postgresql/data
      - ./dev-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo -d cargo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  cargo-dev-db:
