name: Проверка

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cargo
          POSTGRES_PASSWORD: cargo
          POSTGRES_DB: cargo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cargo -d cargo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: Форматирование
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'запустите gofmt -w'; exit 1; }
      - name: Тесты
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://cargo:cargo@localhost:5432/cargo_test?sslmode=disable
        run: go test -p 1 ./...

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Проверка типов и сборка
        working-directory: frontend
        run: npm run check
