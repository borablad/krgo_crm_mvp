name: Выкатка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cargo
          POSTGRES_PASSWORD: cargo
          POSTGRES_DB: cargo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cargo -d cargo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://cargo:cargo@localhost:5432/cargo_test?sslmode=disable
        run: go vet ./... && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run check

  build:
    name: Образ
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Стенд
    needs: build
    runs-on: ubuntu-latest
    environment: stand
    steps:
      - uses: actions/checkout@v4
      - name: Ключ SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Файлы стенда
        run: scp deploy/compose.yml deploy/Caddyfile deploy/backup.sh deploy/restore.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/cargo-crm/
      - name: Обновление контейнеров
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s <<'EOF'
          set -euo pipefail
          cd /opt/cargo-crm
          chmod +x backup.sh restore.sh
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null
          sed -i "s/^APP_TAG=.*/APP_TAG=${{ needs.build.outputs.tag }}/" .env
          docker compose pull -q
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          docker logout ghcr.io >/dev/null
          EOF
      - name: Проверка
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.VPS_HOST }}/api/v1/health" | grep -q '"ok"'; then echo "стенд отвечает"; exit 0; fi
            sleep 3
          done
          echo "стенд не ответил за 90 с"; exit 1
